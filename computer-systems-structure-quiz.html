<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Computer Systems Structure MCQ Quiz</title>
    <style>
        :root {
            --primary-color: #3498db;
            --secondary-color: #2980b9;
            --success-color: #2ecc71;
            --danger-color: #e74c3c;
            --light-color: #ecf0f1;
            --dark-color: #2c3e50;
            --text-color: #333;
            --text-light: #fff;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            line-height: 1.6;
            color: var(--text-color);
            background-color: #f5f5f5;
            margin: 0;
            padding: 0;
            transition: background-color 0.3s, color 0.3s;
        }

        .container {
            min-height: 100vh;
            display: flex;
            gap: 24px;
            align-items: flex-start;
            width: min(1600px, 100%);
            margin: 0 auto;
            padding: 20px;
        }

        .sidebar {
            position: sticky;
            top: 20px;
            width: min(320px, 28vw);
            max-height: calc(100vh - 40px);
            overflow: hidden;
            flex-shrink: 0;
            background-color: var(--dark-color);
            border-radius: 16px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.14);
            transition: width 0.25s ease, box-shadow 0.25s ease;
        }

        .sidebar summary {
            list-style: none;
            display: flex;
            align-items: center;
            gap: 12px;
            cursor: pointer;
            padding: 18px;
            color: var(--text-light);
            font-weight: bold;
            user-select: none;
        }

        .sidebar summary::-webkit-details-marker {
            display: none;
        }

        .sidebar summary::after {
            content: 'Hide';
            margin-left: auto;
            font-size: 0.85rem;
            font-weight: normal;
            opacity: 0.75;
        }

        .sidebar-toggle-icon {
            width: 32px;
            height: 32px;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            border-radius: 10px;
            background-color: rgba(255, 255, 255, 0.12);
            font-size: 1rem;
            flex-shrink: 0;
        }

        .sidebar-title-group {
            min-width: 0;
        }

        .sidebar-title {
            display: block;
            font-size: 1rem;
            line-height: 1.2;
        }

        .sidebar-caption {
            display: block;
            font-size: 0.82rem;
            font-weight: normal;
            opacity: 0.72;
            margin-top: 2px;
        }

        .sidebar:not([open]) {
            width: 82px;
        }

        .sidebar:not([open]) summary {
            justify-content: center;
            padding: 18px 12px;
        }

        .sidebar:not([open]) .sidebar-title-group,
        .sidebar:not([open]) summary::after {
            display: none;
        }

        .sidebar-body {
            border-top: 1px solid rgba(255, 255, 255, 0.12);
            background-color: #233141;
            padding: 14px;
            overflow-y: auto;
            max-height: calc(100vh - 96px);
        }

        .sidebar-hint {
            color: rgba(255, 255, 255, 0.75);
            font-size: 0.92rem;
            margin-bottom: 12px;
        }

        .main-content {
            flex: 1;
            min-width: 0;
            max-width: 1200px;
        }

        header {
            text-align: center;
            margin-bottom: 30px;
            background-color: var(--primary-color);
            color: var(--text-light);
            padding: 30px 20px;
            border-radius: 10px;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
        }

        h1 {
            font-size: 2.5rem;
            margin-bottom: 10px;
        }

        .quiz-container {
            background-color: var(--text-light);
            border-radius: 10px;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
            padding: 30px;
            margin-bottom: 20px;
        }

        .question-container {
            display: none;
        }

        .question-container.active {
            display: block;
        }

        .question {
            font-size: 1.2rem;
            font-weight: bold;
            margin-bottom: 20px;
            color: var(--dark-color);
            line-height: 1.7;
        }

        .question-copy {
            display: block;
            margin-bottom: 12px;
        }

        .options {
            margin-bottom: 20px;
        }

        .option {
            background-color: var(--light-color);
            border: 2px solid #ddd;
            border-radius: 5px;
            padding: 15px;
            margin-bottom: 10px;
            cursor: pointer;
            transition: all 0.3s;
            position: relative;
            display: flex;
            align-items: flex-start;
        }

        .option:hover {
            background-color: #ddd;
            border-color: var(--primary-color);
        }

        .option.selected {
            background-color: var(--primary-color);
            color: var(--text-light);
            border-color: var(--secondary-color);
        }

        .option input {
            margin-right: 15px;
            width: 20px;
            height: 20px;
            cursor: pointer;
            margin-top: 2px;
        }

        .option-label {
            flex: 1;
        }

        .short-answer-input {
            width: 100%;
            padding: 15px;
            border: 2px solid #ddd;
            border-radius: 5px;
            font-size: 1rem;
            margin-bottom: 10px;
        }

        .navigation {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-top: 30px;
        }

        .nav-buttons {
            display: flex;
            gap: 10px;
        }

        button {
            background-color: var(--primary-color);
            color: var(--text-light);
            border: none;
            border-radius: 5px;
            padding: 10px 20px;
            cursor: pointer;
            font-size: 1rem;
            transition: background-color 0.3s;
            font-weight: bold;
        }

        button:hover {
            background-color: var(--secondary-color);
        }

        button:disabled {
            background-color: #95a5a6;
            cursor: not-allowed;
        }

        .progress {
            text-align: center;
            margin: 20px 0;
            font-weight: bold;
            color: var(--dark-color);
        }

        .question-nav {
            display: grid;
            grid-template-columns: repeat(5, minmax(0, 1fr));
            gap: 8px;
        }

        .question-nav button {
            width: 100%;
            min-width: 45px;
            padding: 10px 5px;
            font-size: 0.85rem;
            background-color: #34495e;
            color: var(--text-light);
            border: 1px solid #2c3e50;
            border-radius: 4px;
            cursor: pointer;
            transition: all 0.2s;
        }

        .question-nav button:hover {
            background-color: #4a5f7f;
            transform: scale(1.05);
        }

        .question-nav button.active {
            background-color: var(--success-color);
            color: white;
            font-weight: bold;
        }

        .question-nav button.answered {
            background-color: var(--primary-color);
            color: white;
        }

        .results-container {
            display: none;
            background-color: var(--text-light);
            border-radius: 10px;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
            padding: 30px;
            margin-top: 20px;
        }

        .results-container.active {
            display: block;
        }

        .score {
            font-size: 2.5rem;
            font-weight: bold;
            text-align: center;
            margin-bottom: 20px;
            color: var(--success-color);
        }

        .result-summary {
            margin-bottom: 30px;
            padding: 15px;
            background-color: var(--light-color);
            border-radius: 5px;
        }

        .result-item {
            background-color: var(--text-light);
            border: 1px solid #ddd;
            border-radius: 5px;
            padding: 15px;
            margin-bottom: 10px;
            border-left: 4px solid var(--primary-color);
        }

        .result-item.correct {
            border-left-color: var(--success-color);
        }

        .result-item.incorrect {
            border-left-color: var(--danger-color);
        }

        .result-question {
            font-weight: bold;
            margin-bottom: 5px;
            color: var(--dark-color);
        }

        .result-answer {
            margin-left: 20px;
            color: #666;
        }

        .result-correct {
            color: var(--success-color);
            font-weight: bold;
        }

        .result-incorrect {
            color: var(--danger-color);
            font-weight: bold;
        }

        .dark-mode {
            background-color: #1a1a1a;
            color: #f0f0f0;
        }

        .dark-mode .sidebar {
            background-color: #1a1a1a;
            border: 1px solid #333;
        }

        .dark-mode .sidebar-body {
            background-color: #222;
            border-top-color: rgba(255, 255, 255, 0.08);
        }

        .dark-mode .sidebar-caption,
        .dark-mode .sidebar-hint,
        .dark-mode .sidebar summary::after {
            color: rgba(240, 240, 240, 0.75);
        }

        .dark-mode .quiz-container,
        .dark-mode .results-container,
        .dark-mode .result-item {
            background-color: #2d2d2d;
            color: #f0f0f0;
        }

        .dark-mode .question-nav button {
            background-color: #2d2d2d;
            color: #f0f0f0;
            border-color: #444;
        }

        .dark-mode .question-nav button:hover {
            background-color: #3d3d3d;
        }

        .dark-mode .question {
            color: #f0f0f0;
        }

        .dark-mode .option,
        .dark-mode .short-answer-input {
            background-color: #3a3a3a;
            color: #f0f0f0;
            border-color: #555;
        }

        .dark-mode .option:hover {
            background-color: #454545;
            border-color: #6a9fb5;
        }

        .dark-mode .result-summary {
            background-color: #2d2d2d;
        }

        .category-badge {
            display: inline-block;
            background-color: var(--primary-color);
            color: var(--text-light);
            padding: 3px 8px;
            border-radius: 15px;
            font-size: 0.8rem;
            margin-left: 10px;
            font-weight: normal;
        }

        .timer {
            text-align: center;
            margin-bottom: 20px;
            font-size: 1.1rem;
        }

        .timer-display {
            font-weight: bold;
            color: var(--primary-color);
        }

        pre {
            background: #f4f4f4;
            padding: 15px;
            border-radius: 5px;
            overflow-x: auto;
            margin: 15px 0;
            border-left: 4px solid var(--primary-color);
            line-height: 1.5;
            white-space: pre-wrap;
        }

        .dark-mode pre {
            background: #1e1e1e;
            color: #e8e8e8;
            border-left-color: #6a9fb5;
        }

        code {
            font-family: Consolas, "Andale Mono WT", "Andale Mono", "Lucida Console", "Lucida Sans Typewriter", "DejaVu Sans Mono", "Bitstream Vera Sans Mono", "Liberation Mono", "Nimbus Mono L", Monaco, "Courier New", Courier, monospace;
            background: #f4f4f4;
            padding: 2px 6px;
            border-radius: 3px;
            font-size: 0.9em;
        }

        .dark-mode code {
            background: #3a3a3a;
            color: #f0f0f0;
        }

        pre code {
            background: transparent;
            padding: 0;
        }

        .check-answer-btn {
            background-color: var(--success-color);
            margin-top: 15px;
            width: 100%;
            padding: 12px;
            font-size: 1.1rem;
        }

        .check-answer-btn:hover {
            background-color: #27ae60;
        }

        .check-answer-btn.checked {
            background-color: #95a5a6;
        }

        .answer-feedback {
            margin-top: 15px;
            padding: 15px;
            border-radius: 5px;
            display: none;
            animation: fadeIn 0.3s;
            line-height: 1.8;
        }

        .answer-feedback.show {
            display: block;
        }

        .answer-feedback.correct {
            background-color: #d5f4e6;
            border-left: 4px solid var(--success-color);
            color: #27ae60;
        }

        .answer-feedback.incorrect {
            background-color: #fadbd8;
            border-left: 4px solid var(--danger-color);
            color: #c0392b;
        }

        .answer-feedback strong {
            display: block;
            margin-bottom: 5px;
            font-size: 1.1em;
        }

        .answer-feedback .explanation {
            margin-top: 12px;
            padding-top: 10px;
            border-top: 1px solid rgba(0, 0, 0, 0.1);
            color: #555;
            font-size: 0.95em;
        }

        .dark-mode .answer-feedback.correct {
            background-color: rgba(46, 204, 113, 0.2);
            color: #a8e6cf;
        }

        .dark-mode .answer-feedback.incorrect {
            background-color: rgba(231, 76, 60, 0.2);
            color: #ffccbc;
        }

        .dark-mode .answer-feedback .explanation {
            color: #bbb;
            border-top-color: rgba(255, 255, 255, 0.1);
        }

        @media (max-width: 900px) {
            .container {
                display: block;
                padding: 16px;
            }

            .sidebar,
            .sidebar:not([open]) {
                position: static;
                width: 100%;
                max-height: none;
                margin-bottom: 16px;
            }

            .sidebar:not([open]) summary {
                justify-content: flex-start;
                padding: 16px 18px;
            }

            .sidebar:not([open]) .sidebar-title-group {
                display: block;
            }

            .sidebar:not([open]) summary::after {
                display: block;
                content: 'Show';
            }

            .sidebar-body {
                max-height: 40vh;
            }

            .main-content {
                max-width: none;
            }

            .question-nav {
                grid-template-columns: repeat(6, minmax(0, 1fr));
            }

            .quiz-container,
            .results-container {
                padding: 20px;
            }

            h1 {
                font-size: 2rem;
            }

            .navigation {
                flex-direction: column;
                gap: 12px;
                align-items: stretch;
            }

            .nav-buttons {
                width: 100%;
            }

            .nav-buttons button,
            #submit-btn {
                flex: 1;
                width: 100%;
            }
        }

        @media (max-width: 600px) {
            .container {
                padding: 12px;
            }

            body {
                font-size: 15px;
            }

            header {
                padding: 22px 16px;
            }

            .sidebar summary {
                padding: 14px 16px;
            }

            h1 {
                font-size: 1.65rem;
            }

            .question {
                font-size: 1.05rem;
            }

            .question-nav {
                grid-template-columns: repeat(4, minmax(0, 1fr));
                gap: 6px;
            }

            .question-nav button {
                min-width: 0;
                padding: 9px 4px;
                font-size: 0.8rem;
            }

            .quiz-container,
            .results-container {
                padding: 16px;
                border-radius: 8px;
            }

            .option,
            .short-answer-input {
                padding: 12px;
            }

            .timer {
                display: flex;
                flex-wrap: wrap;
                justify-content: center;
                gap: 8px;
            }

            .timer button {
                margin-left: 0 !important;
            }
        }

        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: translateY(-10px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <details class="sidebar" id="question-sidebar" open>
            <summary>
                <span class="sidebar-toggle-icon">#</span>
                <span class="sidebar-title-group">
                    <span class="sidebar-title">Question Navigation</span>
                    <span class="sidebar-caption">Jump anywhere in the quiz</span>
                </span>
            </summary>
            <div class="sidebar-body">
                <p class="sidebar-hint">Use the numbered buttons to move directly to any question.</p>
                <div class="question-nav" id="question-nav"></div>
            </div>
        </details>

        <div class="main-content">
            <header>
                <h1>Computer Systems Structure Quiz</h1>
                <p>MCQ practice set covering core computer systems structure topics.</p>
            </header>

            <div class="quiz-container">
                <div class="timer">
                    Time: <span class="timer-display" id="timer">00:00</span>
                    <button id="toggleTimer" style="padding: 5px 10px; margin-left: 10px;">Pause</button>
                    <button id="darkModeToggle" style="padding: 5px 10px; margin-left: 10px;">Dark Mode</button>
                </div>

                <div class="progress">
                    Question <span id="current-question-idx">1</span> of <span id="total-questions-count">0</span>
                </div>

                <div id="questions-container"></div>

                <div class="navigation">
                    <div class="nav-buttons">
                        <button id="prev-btn" disabled>Previous</button>
                        <button id="next-btn">Next</button>
                    </div>
                    <button id="submit-btn">Submit Quiz</button>
                </div>
            </div>

            <div id="results-container" class="results-container">
                <div class="score" id="score"></div>
                <div id="score-details" style="text-align: center; margin-bottom: 20px;"></div>
                <div class="result-summary" id="result-summary"></div>
                <div id="results-list"></div>
                <div style="text-align: center; margin-top: 30px;">
                    <button id="retake-btn">Retake Quiz</button>
                </div>
            </div>
        </div>
    </div>

    <script>
        const quizData = [
            {
                question: "According to the course introduction, what is Part 1 of the course plan?",
                options: [
                    "Computer Logic and Circuitry",
                    "Computer Intercommunication",
                    "External Memory Systems",
                    "Operating System Design"
                ],
                correct: 0,
                category: "Course Intro",
                type: "single",
                explanation: "The introduction presentation lists Part 1 as Computer Logic and Circuitry, followed by instruction set and hardware programming, and then computer intercommunication."
            },
            {
                question: "What kind of signals do computers work with directly?",
                options: [
                    "Only analog signals",
                    "Only digital signals",
                    "Only optical signals",
                    "Only acoustic signals"
                ],
                correct: 1,
                category: "Course Intro",
                type: "single",
                explanation: "The introduction slides state that computers work only with digital signals."
            },
            {
                question: "Before analog information can be processed in a computer, what must happen to it?",
                options: [
                    "It must be amplified only",
                    "It must be encrypted",
                    "It must be digitized into discrete form",
                    "It must be converted to decimal form"
                ],
                correct: 2,
                category: "Course Intro",
                type: "single",
                explanation: "Both the introduction presentation and the first conspect explain that analog information must be transformed into a discrete form, that is, digitized."
            },
            {
                question: "Which person is most strongly associated in the course materials with the stored-program computer concept?",
                options: [
                    "Blaise Pascal",
                    "George Boole",
                    "John von Neumann",
                    "Herman Hollerith"
                ],
                correct: 2,
                category: "Course Intro",
                type: "single",
                explanation: "The first handout attributes the stored-program computer concept to the ENIAC designers, most notably John von Neumann."
            },
            {
                question: "In the von Neumann proposal summarized in the course material, which three main parts form the computer architecture?",
                options: [
                    "CPU, cache, and compiler",
                    "CPU, memory, and a connecting device or data bus",
                    "ALU, monitor, and keyboard",
                    "Registers, disk, and operating system"
                ],
                correct: 1,
                category: "Course Intro",
                type: "single",
                explanation: "The materials describe three main parts: CPU, memory, and a connecting device that can transmit a single data word at a time between them."
            },
            {
                question: "Which architecture uses the same memory for both instructions and data?",
                options: [
                    "Von Neumann architecture",
                    "Harvard architecture",
                    "RISC architecture",
                    "EPIC architecture"
                ],
                correct: 0,
                category: "Course Intro",
                type: "single",
                explanation: "Von Neumann architecture stores instructions and data in the same memory, while Harvard architecture separates them."
            },
            {
                question: "In a positional number system, what determines the value of a digit?",
                options: [
                    "Only the symbol itself",
                    "Only the color used to write it",
                    "Its absolute value and its position in the number",
                    "The parity of the whole number only"
                ],
                correct: 2,
                category: "Number Systems",
                type: "single",
                explanation: "The arithmetic handout defines a positional system as one in which a digit value depends on both its own value and its position."
            },
            {
                question: "What is the radix or base of a positional number system?",
                options: [
                    "The number of digits placed to the left of the point",
                    "The count of different digits available in the system",
                    "The number of bits in a processor word",
                    "The number of arithmetic operations supported"
                ],
                correct: 1,
                category: "Number Systems",
                type: "single",
                explanation: "The radix is defined as the number of various digits used in the positional system."
            },
            {
                question: "What is a bit?",
                options: [
                    "A decimal digit",
                    "A binary digit",
                    "A hexadecimal nibble",
                    "A memory block"
                ],
                correct: 1,
                category: "Number Systems",
                type: "single",
                explanation: "The handout states that a binary digit is called a bit."
            },
            {
                question: "How many binary bits correspond to one octal digit?",
                options: [
                    "2",
                    "3",
                    "4",
                    "8"
                ],
                correct: 1,
                category: "Number Systems",
                type: "single",
                explanation: "Since 8 = 2^3, each octal digit maps to a three-bit binary group."
            },
            {
                question: "How many binary bits correspond to one hexadecimal digit?",
                options: [
                    "2",
                    "3",
                    "4",
                    "16"
                ],
                correct: 2,
                category: "Number Systems",
                type: "single",
                explanation: "Since 16 = 2^4, each hexadecimal digit maps to a four-bit binary group."
            },
            {
                question: "Which limitation of the Roman numeral system is explicitly mentioned in the materials?",
                options: [
                    "It has too many symbols for computers",
                    "It lacks a symbol for zero and convenient fractions",
                    "It uses only lowercase letters",
                    "It cannot represent positive numbers"
                ],
                correct: 1,
                category: "Number Systems",
                type: "single",
                explanation: "The course notes state that the Roman system lacks a zero symbol and ordinary or decimal fractions, which makes it unsuitable for digital computing."
            },
            {
                question: "Boolean variables in the course logic notes can take values only from which set?",
                options: [
                    "{-1, 0, 1}",
                    "{0, 1}",
                    "{A, B}",
                    "{true, false, maybe}"
                ],
                correct: 1,
                category: "Boolean Logic",
                type: "single",
                explanation: "The logic handout defines Boolean functions over arguments that may take values only from the set {0, 1}."
            },
            {
                question: "How many rows does a truth table for n Boolean variables have?",
                options: [
                    "n",
                    "n^2",
                    "2n",
                    "2^n"
                ],
                correct: 3,
                category: "Boolean Logic",
                type: "single",
                explanation: "The handout states that all n-bit binary combinations are listed, so a truth table has 2^n rows."
            },
            {
                question: "What is the output of the NOT function when its input is 0?",
                options: [
                    "0",
                    "1",
                    "Undefined",
                    "Depends on the gate"
                ],
                correct: 1,
                category: "Boolean Logic",
                type: "single",
                explanation: "The NOT or inversion function complements the input, so 0 becomes 1."
            },
            {
                question: "When does the AND function produce 1?",
                options: [
                    "When at least one input is 1",
                    "When both inputs are 0",
                    "Only when both inputs are 1",
                    "Whenever the inputs are different"
                ],
                correct: 2,
                category: "Boolean Logic",
                type: "single",
                explanation: "The truth table in the notes shows conjunction equals 1 only for input pair 1 and 1."

        function sentenceCase(text) {
            if (!text) {
                return text;
            }

            return text.charAt(0).toUpperCase() + text.slice(1);
        }

        function cleanSourceReferences(text, kind) {
            let value = String(text || '').replace(/\s+/g, ' ').trim();
            if (!value) {
                return value;
            }

            if (kind === 'question') {
                value = value
                    .replace(/^According to the [^,?]+,\s*/i, '')
                    .replace(/^In the presentation,\s*/i, '')
                    .replace(/^In the [^,?]+ presentation,\s*/i, '')
                    .replace(/^In the [^,?]+ slides?,\s*/i, '')
                    .replace(/^In the [^,?]+ slide deck,\s*/i, '')
                    .replace(/ in the course materials?/ig, '')
                    .replace(/ in the course notes/ig, '')
                    .replace(/ in the materials/ig, '')
                    .replace(/ in the notes/ig, '')
                    .replace(/ in the [^?.,]+ notes/ig, '')
                    .replace(/ in the [a-z0-9-]+ notes/ig, '')
                    .replace(/ from the [^?]+ presentation/ig, '')
                    .replace(/ according to the [^?]+ presentation/ig, '')
                    .replace(/ according to the [^?]+ slides?/ig, '')
                    .replace(/ according to the [^?]+ slide deck/ig, '')
                    .replace(/ according to the slide rule/ig, '')
                    .replace(/ in the [^?]+ presentation/ig, '')
                    .replace(/ in the [^?]+ slide deck/ig, '')
                    .replace(/ in the [^?]+ slides/ig, '')
                    .replace(/ given in the [^?]+ slides/ig, '')
                    .replace(/ according to the presentation/ig, '')
                    .replace(/ according to the slides/ig, '')
                    .replace(/ in the presentation/ig, '')
                    .replace(/ in the slides/ig, '')
                    .replace(/ in the slide deck/ig, '')
                    .replace(/\s{2,}/g, ' ')
                    .trim();

                return sentenceCase(value);
            }

            value = value
                .replace(/^Both the [^,.]*(?:presentation|presentations|slides?|handout|notes?|materials?|conspect|chapter)[^,.]* (?:state|states|say|says|explain|explains|describe|describes|define|defines)\s+(?:that\s+)?/i, '')
                .replace(/^The [^,.]*(?:presentation|presentations|slides?|slide deck|handout|notes?|materials?|conspect|chapter)[^,.]* (?:state|states|say|says|explain|explains|describe|describes|define|defines|list|lists|note|notes|show|shows|identify|identifies|attribute|attributes|place|places|expand|expands)\s+(?:that\s+)?/i, '')
                .replace(/ in the [^.,]+ notes/ig, '')
                .replace(/ according to the [^.,]+ slides?/ig, '')
                .replace(/ according to the [^.,]+ slide deck/ig, '')
                .replace(/\s{2,}/g, ' ')
                .trim();

            return sentenceCase(value);
        }

        function sanitizeQuizData(items) {
            const categoryMap = {
                'Course Intro': 'Introduction',
                'Control Unit Slides': 'Control Unit',
                'Memory Slides': 'Memory',
                'Functional Organization Slides': 'Functional Organization',
                'External Memory Slides': 'External Memory'
            };

            const questionOverrides = new Map([
                ['In the von Neumann proposal summarized in the course material, which three main parts form the computer architecture?', 'In the von Neumann model, which three main parts form the computer architecture?'],
                ['What does the Princeton architecture mean in the course notes?', 'Which architecture uses the same memory for both instructions and data?'],
                ['Which four lines are identified in the SPI presentation?', 'Which four signal lines are used in SPI?'],
                ['Why does the presentation load 2 * myStr into the Z pointer before calling puts?', 'Why is 2 * myStr loaded into the Z pointer before calling puts?'],
                ['In the presentation, bitrate refers to what?', 'What does bitrate refer to?'],
                ['In the presentation, baudrate refers to what?', 'What does baudrate refer to?'],
                ['What does the presentation say assemblers essentially perform?', 'What do assemblers essentially perform?'],
                ['How large is the status register in the AVR status-register presentation?', 'How large is the AVR status register?'],
                ['For an input-output instruction in the same presentation, what is the value of the last bit?', 'For an input-output instruction, what is the value of the last bit?'],
                ['In the control-unit notes, what is a microoperation?', 'What is a microoperation?'],
                ['What is the Intel 8085 according to the presentation?', 'What is the Intel 8085?'],
                ['What is the core idea of Von Neumann architecture in the functional-organization presentation?', 'What is the core idea of Von Neumann architecture?'],
                ['How is external memory described in the external-memory presentation?', 'How is external memory described?'],
                ['What does the instruction buffer register hold according to the slide deck?', 'What does the instruction buffer register hold?'],
                ['Which item is presented as an SPI advantage?', 'Which SPI feature allows simultaneous sending and receiving of data?']
            ]);

            items.forEach((item) => {
                if (categoryMap[item.category]) {
                    item.category = categoryMap[item.category];
                }

                if (item.question === 'What does the Princeton architecture mean in the course notes?') {
                    item.options = [
                        'Von Neumann architecture',
                        'Harvard architecture',
                        'RISC architecture',
                        'EPIC architecture'
                    ];
                    item.correct = 0;
                    item.explanation = 'Von Neumann architecture stores instructions and data in the same memory, while Harvard architecture separates them.';
                }

                if (item.question === 'What sector size is described as nearly universal in contemporary disk systems?') {
                    item.question = 'In the illustrated disk-format example, how much user data does each sector hold?';
                    item.options = ['64 bytes', '128 bytes', '512 bytes', '4096 words'];
                    item.correct = 2;
                    item.explanation = 'In the example track format, each sector stores 512 bytes of user data plus control information.';
                }

                if (item.question === 'Which item is presented as an SPI advantage?') {
                    item.explanation = 'Separate MOSI and MISO lines let SPI support full-duplex data transfer.';
                }

                if (item.explanation === 'The MPA input list in the notes includes the clock, instruction register, flags, and control signals from the control bus.') {
                    item.explanation = 'The inputs include the clock, instruction register, flags, and control signals from the control bus.';
                }

                item.question = questionOverrides.get(item.question) || cleanSourceReferences(item.question, 'question');
                item.explanation = cleanSourceReferences(item.explanation, 'explanation');
            });
        }

                btn.textContent = idx + 1;
                btn.setAttribute('aria-label', 'Go to question ' + (idx + 1));
                btn.onclick = () => goToQuestion(idx);
                questionNav.appendChild(btn);
            });

            function updateNav() {
                const btns = questionNav.querySelectorAll('button');
                btns.forEach((btn, idx) => {
                    btn.classList.remove('active', 'answered');
                    if (idx === currentQuestion) {
                        btn.classList.add('active');
                    } else if (userAnswers[idx] !== null && userAnswers[idx] !== '') {
                        btn.classList.add('answered');
                    }
                });

                const activeButton = questionNav.children[currentQuestion];
                if (activeButton) {
                    activeButton.scrollIntoView({ behavior: 'smooth', block: 'nearest', inline: 'nearest' });
                }
            }

            function renderQuestion() {
                questionsContainer.innerHTML = '';
                const q = quizData[currentQuestion];
                currentQuestionIdx.textContent = currentQuestion + 1;

                const qDiv = document.createElement('div');
                qDiv.className = 'question-container active';

                const qText = document.createElement('div');
                qText.className = 'question';
                qText.innerHTML = (currentQuestion + 1) + '. ' + formatQuestionText(q.question) +
                    '<span class="category-badge">' + escapeHtml(q.category) + '</span>';
                qDiv.appendChild(qText);

                const optionsDiv = document.createElement('div');
                optionsDiv.className = 'options';

                if (q.type === 'shortanswer' || q.options.length === 0) {
                    const input = document.createElement('input');
                    input.type = 'text';
                    input.className = 'short-answer-input';
                    input.placeholder = 'Type your answer here...';
                    input.value = userAnswers[currentQuestion] || '';
                    input.oninput = (e) => {
                        userAnswers[currentQuestion] = e.target.value;
                        updateNav();
                    };
                    optionsDiv.appendChild(input);
                } else {
                    q.options.forEach((opt, idx) => {
                        const optDiv = document.createElement('div');
                        optDiv.className = 'option';
                        if (userAnswers[currentQuestion] === idx) {
                            optDiv.classList.add('selected');
                        }

                        const input = document.createElement('input');
                        input.type = 'radio';
                        input.name = 'question-' + currentQuestion;
                        input.checked = userAnswers[currentQuestion] === idx;
                        input.onclick = (e) => e.stopPropagation();
                        input.onchange = () => selectOption(idx);

                        optDiv.onclick = () => selectOption(idx);
                        optDiv.appendChild(input);

                        const label = document.createElement('span');
                        label.className = 'option-label';
                        label.innerHTML = formatOptionText(opt);
                        optDiv.appendChild(label);
                        optionsDiv.appendChild(optDiv);
                    });
                }

                qDiv.appendChild(optionsDiv);

                const checkBtn = document.createElement('button');
                checkBtn.className = 'check-answer-btn';
                checkBtn.textContent = 'Check Answer';
                checkBtn.onclick = () => checkAnswer(currentQuestion);
                qDiv.appendChild(checkBtn);

                const feedbackDiv = document.createElement('div');
                feedbackDiv.className = 'answer-feedback';
                feedbackDiv.id = 'answer-feedback-' + currentQuestion;
                qDiv.appendChild(feedbackDiv);

                questionsContainer.appendChild(qDiv);

                prevBtn.disabled = currentQuestion === 0;
                nextBtn.disabled = currentQuestion === quizData.length - 1;
                updateNav();
            }

            function checkAnswer(qIndex) {
                const q = quizData[qIndex];
                const feedbackDiv = document.getElementById('answer-feedback-' + qIndex);
                const checkBtn = document.querySelector('.check-answer-btn');

                if (!feedbackDiv) {
                    return;
                }

                const userAns = userAnswers[qIndex];
                if (userAns === null || userAns === '') {
                    feedbackDiv.innerHTML = '<strong>Please select an answer first.</strong>';
                    feedbackDiv.className = 'answer-feedback show incorrect';
                    return;
                }

                const isCorrect = userAns === q.correct;
                let feedbackHTML = '';

                if (isCorrect) {
                    feedbackHTML = '<strong>Correct.</strong>';
                    feedbackDiv.className = 'answer-feedback show correct';
                } else {
                    feedbackHTML = '<strong>Incorrect.</strong>';
                    feedbackHTML += '<div style="margin-top: 8px;">Correct answer: <strong>' + escapeHtml(q.options[q.correct]) + '</strong></div>';
                    feedbackDiv.className = 'answer-feedback show incorrect';
                }

                if (q.explanation) {
                    feedbackHTML += '<div class="explanation"><strong>Explanation:</strong><br>' + escapeHtml(q.explanation) + '</div>';
                }

                feedbackDiv.innerHTML = feedbackHTML;
                checkBtn.textContent = 'Answer Checked';
                checkBtn.classList.add('checked');
            }

            function escapeHtml(value) {
                return String(value)
                    .replace(/&/g, '&amp;')
                    .replace(/</g, '&lt;')
                    .replace(/>/g, '&gt;')
                    .replace(/"/g, '&quot;')
                    .replace(/'/g, '&#39;');
            }

            function looksLikeCodeSnippet(text) {
                const candidate = String(text || '').trim();
                if (!candidate) {
                    return false;
                }

                let score = 0;
                if ((candidate.match(/;/g) || []).length >= 1) {
                    score += 2;
                }
                if (candidate.includes('\n')) {
                    score += 1;
                }

                [
                    /\b(?:int|char|float|double|bool|void|const|long|short|unsigned|signed|for|while|if|else|switch|case|return|ldi|lds|sts|rcall|ret|cpi|breq|rjmp)\b/,
                    /[{}]/,
                    /<<|>>/,
                    /\b[A-Za-z_]\w*\s*\([^)]*\)/,
                    /\[[^\]]*\]/,
                    /->/,
                    /\.[a-z]+/i
                ].forEach((pattern) => {
                    if (pattern.test(candidate)) {
                        score += 1;
                    }
                });

                return score >= 3;
            }

            function splitQuestionText(text) {
                const normalized = String(text || '').replace(/\r\n/g, '\n').trim();
                if (!normalized) {
                    return { lead: '', code: '' };
                }

                const lines = normalized.split('\n');
                const codeStart = lines.findIndex((line) => looksLikeCodeSnippet(line));
                if (codeStart > 0) {
                    const lead = lines.slice(0, codeStart).join('\n').trim();
                    const code = lines.slice(codeStart).join('\n').trim();
                    if (code) {
                        return { lead, code };
                    }
                }

                if (looksLikeCodeSnippet(normalized)) {
                    return { lead: '', code: normalized };
                }

                return { lead: normalized, code: '' };
            }

            function formatInlineQuestionText(text) {
                return escapeHtml(text).replace(/\n/g, '<br>');
            }

            function formatQuestionText(text) {
                const segments = splitQuestionText(text);
                if (segments.code) {
                    const lead = segments.lead ? '<span class="question-copy">' + formatInlineQuestionText(segments.lead) + '</span>' : '';
                    return lead + '<pre><code>' + escapeHtml(segments.code) + '</code></pre>';
                }

                return formatInlineQuestionText(segments.lead);
            }

            function formatOptionText(text) {
                const value = String(text || '').trim();
                if (!value) {
                    return '';
                }

                if (looksLikeCodeSnippet(value)) {
                    return '<pre><code>' + escapeHtml(value) + '</code></pre>';
                }

                return formatInlineQuestionText(value);
            }

            function selectOption(idx) {
                userAnswers[currentQuestion] = idx;
                renderQuestion();
            }

            function goToQuestion(idx) {
                currentQuestion = idx;
                renderQuestion();
            }

            function formatUserAnswer(ans, q) {
                if (ans === null || ans === undefined || ans === '') {
                    return 'No answer';
                }

                return escapeHtml(q.options[ans] || ans);
            }

            function showResults() {
                clearInterval(timerInterval);
                let score = 0;
                let resultsHTML = '';
                const categoryStats = new Map();

                quizData.forEach((q, idx) => {
                    const userAns = userAnswers[idx];
                    const isCorrect = userAns === q.correct;

                    if (isCorrect) {
                        score++;
                    }

                    if (!categoryStats.has(q.category)) {
                        categoryStats.set(q.category, { total: 0, correct: 0 });
                    }
                    const categoryStat = categoryStats.get(q.category);
                    categoryStat.total += 1;
                    if (isCorrect) {
                        categoryStat.correct += 1;
                    }

                    resultsHTML +=
                        '<div class="result-item ' + (isCorrect ? 'correct' : 'incorrect') + '">' +
                        '<div class="result-question">Question ' + (idx + 1) + ': ' + formatQuestionText(q.question) + '</div>' +
                        '<div class="result-answer">Your answer: <span class="' + (isCorrect ? 'result-correct' : 'result-incorrect') + '">' + formatUserAnswer(userAns, q) + (isCorrect ? ' OK' : ' X') + '</span></div>' +
                        (isCorrect ? '' : '<div class="result-answer">Correct answer: <span class="result-correct">' + escapeHtml(q.options[q.correct]) + '</span></div>') +
                        '</div>';
                });

                const percentage = Math.round((score / quizData.length) * 100);
                document.getElementById('score').textContent = 'Your Score: ' + score + ' / ' + quizData.length + ' (' + percentage + '%)';
                document.getElementById('score-details').textContent = 'You answered ' + score + ' questions correctly across ' + categoryStats.size + ' topic areas.';

                let summaryHtml = '<strong>Category breakdown:</strong><br>';
                categoryStats.forEach((stat, category) => {
                    summaryHtml += escapeHtml(category) + ': ' + stat.correct + ' / ' + stat.total + '<br>';
                });
                document.getElementById('result-summary').innerHTML = summaryHtml;

                document.getElementById('results-list').innerHTML = resultsHTML;
                resultsContainer.classList.add('active');
                quizBox.style.display = 'none';
                window.scrollTo(0, 0);
            }

            function startTimer() {
                timerInterval = setInterval(() => {
                    if (isTimerRunning) {
                        timeElapsed++;
                        const mins = Math.floor(timeElapsed / 60).toString().padStart(2, '0');
                        const secs = (timeElapsed % 60).toString().padStart(2, '0');
                        timerEl.textContent = mins + ':' + secs;
                    }
                }, 1000);
            }

            prevBtn.onclick = () => {
                if (currentQuestion > 0) {
                    goToQuestion(currentQuestion - 1);
                }
            };

            nextBtn.onclick = () => {
                if (currentQuestion < quizData.length - 1) {
                    goToQuestion(currentQuestion + 1);
                }
            };

            submitBtn.onclick = showResults;

            toggleTimerBtn.onclick = () => {
                isTimerRunning = !isTimerRunning;
                toggleTimerBtn.textContent = isTimerRunning ? 'Pause' : 'Resume';
            };

            darkModeToggle.onclick = () => {
                document.body.classList.toggle('dark-mode');
            };

            document.getElementById('retake-btn').onclick = () => {
                location.reload();
            };

            startTimer();
            renderQuestion();
        });
    </script>
</body>
</html>
